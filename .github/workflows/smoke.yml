name: Protocol Smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-smoke:
    runs-on: ubuntu-latest
    env:
      PARTNER_ID: gh-copilot-partner
      PARTNER_CONFIG: partners/config.example.json
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Smoke tools/list over stdio
        run: python3 tools/mcp_smoke.py --list
      - name: Smoke partner_info call
        run: python3 tools/mcp_smoke.py --call partner_info
      - name: Smoke list_partner_skills call
        run: python3 tools/mcp_smoke.py --call list_partner_skills
