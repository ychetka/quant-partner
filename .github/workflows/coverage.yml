name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      PARTNER_ID: gh-copilot-partner
      PARTNER_CONFIG: partners/config.example.json
      PYTHONPATH: ${{ github.workspace }}/.cov-ci
      COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
      # Coverage ratchet floors (issue #93). Baseline measured
      # 2026-11-11 on main: 87% TOTAL. Bump procedure is documented
      # in README.md ("Coverage floor").
      COVERAGE_TOTAL_FLOOR: "85"
      COVERAGE_HTTP_FLOOR: "52"
      COVERAGE_COPILOT_FLOOR: "60"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install subprocess coverage hook
        # sitecustomize.py on PYTHONPATH starts coverage inside the MCP
        # server subprocess spawned by tools/mcp_smoke.py. The file is
        # generated at run time and is never committed.
        run: |
          mkdir -p .cov-ci
          cat > .cov-ci/sitecustomize.py <<'PYEOF'
          """Start coverage in child processes of measured CI runs."""

          import os
          import sys

          if os.environ.get("COVERAGE_PROCESS_START"):
              try:
                  import coverage

                  coverage.process_startup()
              except Exception:
                  print(
                      "coverage: subprocess startup unavailable",
                      file=sys.stderr,
                  )
          PYEOF
      - name: Run unit tests under coverage
        continue-on-error: true
        run: uv run --with "pytest==9.2.0" --with "coverage==7.6.1" coverage run -m pytest -x -q
      - name: Smoke tools/list under coverage
        continue-on-error: true
        run: uv run --with "coverage==7.6.1" coverage run tools/mcp_smoke.py --list
      - name: Smoke partner_info call under coverage
        continue-on-error: true
        run: uv run --with "coverage==7.6.1" coverage run tools/mcp_smoke.py --call partner_info
      - name: Verify subprocess coverage data
        continue-on-error: true
        run: |
          count=$(ls .coverage.* 2>/dev/null | wc -l)
          echo "coverage data files: $count"
          ls -la .coverage.* || true
          if [ "$count" -lt 2 ]; then
            echo "::warning::expected data files from both the smoke client and the MCP server subprocess"
          fi
      - name: Combine coverage data
        continue-on-error: true
        run: uv run --with "coverage==7.6.1" coverage combine
      - name: Report coverage to step summary
        continue-on-error: true
        run: uv run --with "coverage==7.6.1" coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Export coverage JSON
        continue-on-error: true
        run: uv run --with "coverage==7.6.1" coverage json -o coverage.json
      - name: Upload coverage report
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          include-hidden-files: true
          path: |
            coverage.json
            .coverage.*
      - name: Enforce coverage floor
        # Hard gate - intentionally no continue-on-error. Every step
        # above is report-only, so a missing coverage.json fails here.
        run: |
          python3 - <<'PYEOF'
          """Fail the job when coverage drops below the ratchet floors."""

          import json
          import math
          import os
          import sys

          def floor(name):
              raw = os.environ.get(name, "")
              try:
                  value = float(raw)
              except ValueError:
                  print(f"::error::{name}={raw!r} is not a number")
                  sys.exit(1)
              if not math.isfinite(value):
                  print(f"::error::{name}={raw!r} is not finite")
                  sys.exit(1)
              return value

          def percent(entry, label):
              value = entry.get("percent_covered")
              if not isinstance(value, (int, float)) or not math.isfinite(value):
                  print(f"::error::{label} has invalid percent_covered {value!r}")
                  return None
              return value

          def reject_constant(value):
              raise ValueError(f"non-finite JSON constant {value!r}")

          try:
              with open("coverage.json", encoding="utf-8") as fh:
                  data = json.load(fh, parse_constant=reject_constant)
          except (OSError, ValueError) as exc:
              print(f"::error::coverage.json missing or unparseable: {exc}")
              sys.exit(1)

          total_floor = floor("COVERAGE_TOTAL_FLOOR")
          http_floor = floor("COVERAGE_HTTP_FLOOR")
          copilot_floor = floor("COVERAGE_COPILOT_FLOOR")

          total = percent(data.get("totals", {}), "totals")
          if total is None:
              sys.exit(1)

          failed = False
          if total < total_floor:
              print(
                  f"::error::total coverage {total:.1f}% is below the "
                  f"{total_floor:.0f}% floor (COVERAGE_TOTAL_FLOOR)"
              )
              failed = True
          elif total > total_floor + 2:
              print(
                  f"::notice::total coverage {total:.1f}% is more than 2 "
                  f"points above the {total_floor:.0f}% floor - raise "
                  "COVERAGE_TOTAL_FLOOR (see README 'Coverage floor')"
              )

          files = data.get("files", {})
          for path, file_floor, var in (
              ("partners/core/http.py", http_floor, "COVERAGE_HTTP_FLOOR"),
              (
                  "partners/backends/copilot_direct.py",
                  copilot_floor,
                  "COVERAGE_COPILOT_FLOOR",
              ),
          ):
              entry = files.get(path)
              if entry is None:
                  print(
                      f"::warning::{path} absent from coverage.json - "
                      "per-file floor skipped"
                  )
                  continue
              pct = percent(entry.get("summary", {}), path)
              if pct is None:
                  failed = True
              elif pct < file_floor:
                  print(
                      f"::error::{path} coverage {pct:.1f}% is below the "
                      f"{file_floor:.0f}% floor ({var})"
                  )
                  failed = True

          if failed:
              sys.exit(1)
          print(
              f"coverage floors OK: total {total:.1f}% >= "
              f"{total_floor:.0f}%"
          )
          PYEOF
